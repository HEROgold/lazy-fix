[project]
site_name = "lazy-fix"
site_url = "https://herogold.github.io/lazy-fix/"
site_description = "Check and fix Python imports into PEP 810 lazy imports."
repo_url = "https://github.com/HEROgold/lazy-fix"
repo_name = "HEROgold/lazy-fix"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "CLI reference" = "cli.md" },
  { "Configuration reference" = "configuration.md" },
  { "Pre-commit integration" = "pre-commit.md" },
  { "PEP 810 and __lazy_modules__" = "pep810.md" },
]

[project.theme]
variant = "classic"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/HEROgold/lazy-fix"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
def_list = {}
footnotes = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.details = {}
pymdownx.emoji = {}
toc.permalink = true

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
docstring_style = "google"
separate_signature = true
show_symbol_type_toc = true
merge_init_into_class = true
members_order = "source"
show_if_no_docstring = true
line_length = 100
show_root_heading = true
show_signature = true
signature_crossrefs = true
annotations_path = "source"
inherited_members = true
filters = ["!^__weakref__$"]

[project.plugins.mkdocstrings.handlers.python.options.extra]
show_type_annotations = true
