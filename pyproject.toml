[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hypothesis>=6.161.2",
  "mypy>=2.3.0",
  "pyrefly>=1.1.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
  "ty>=0.0.63",
  "zuban>=0.9.0",
]
docs = [
  "zensical",
  "mkdocstrings[python]>=1.0.6",
]

[project]
name = "lazy-fix"
version = "0.1.0"
description = "Check and fix Python imports into PEP 810 lazy imports"
authors = [{ name = "HEROgold" }]
readme = "README.md"
requires-python = ">=3.15"
license = { text = "MIT" }
keywords = ["lazy-imports", "pep-810", "codemod", "linter", "formatter", "pre-commit", "libcst"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "confkit[msgspec]>=2.1.0",
  "herogold>=3.6.0",
  "libcst>=1.9.0",
  "rich>=15.0.0",
]

[project.scripts]
lazy-fix = "lazy_fix.cli:main"

[project.urls]
Homepage = "https://herogold.github.io/lazy-fix/"
Repository = "https://github.com/HEROgold/lazy-fix"
Issues = "https://github.com/HEROgold/lazy-fix/issues"

[tool.lazy-fix]
# Module names eligible to be made lazy. Matched on the source module only,
# e.g. listing "numpy" governs both `import numpy` and `from numpy import array`.
allow = []
deny = []

[tool.skylos]
# SKY-D223 "undeclared dependency": Skylos reads declared dependencies from
# [project.dependencies] and [project.optional-dependencies] only. It does not
# understand PEP 735 [dependency-groups], so pytest and hypothesis — which are
# declared in the `dev` group above — are reported as undeclared imports.
ignore = ["SKY-D223"]

[tool.pyrefly]
# The tests are a package of their own (``tests/__init__.py``); without this pyrefly
# infers ``src`` as the only import root and cannot resolve intra-test imports.
search-path = ["src", "."]
