name: Bump Version By Labels

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.*"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Determine version bump
        id: detect-bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Check PR labels to determine bump type
          if echo "$LABELS" | grep -iq "Major"; then
            echo "bump_type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -iq "Minor"; then
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -iq "Patch"; then
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "bump_type=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push directly to main
        if: steps.detect-bump.outputs.bump_type != ''
        run: |
          uv version --bump ${{ steps.detect-bump.outputs.bump_type }}
          NEW_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main

          # release.yml watches main for a version with no matching vX.Y.Z tag
          # yet and tags/releases it from there - no tag is pushed here.
